name: Check published results

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: v1 results reproduce
        working-directory: v1
        run: |
          python3 scripts/analyze.py
          python3 -m unittest discover -s tests
      - name: v2 scorecard reproduces
        working-directory: v2
        run: |
          python3 scripts/score_pushback_drift.py --out /tmp/scorecard.md data/conversations.jsonl > /dev/null
          diff data/scorecard.md /tmp/scorecard.md
